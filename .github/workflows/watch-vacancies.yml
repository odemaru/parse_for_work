name: Мониторинг вакансий

on:
  schedule:
    - cron: "17 12 * * *"   # 15:17 МСК; минуты не ровные — на ровных часах у GitHub пик
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать найденное, ничего не отправлять"
        type: boolean
        default: false
      announce:
        description: "Прислать в чат сводку: с каких компаний берутся вакансии"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch-vacancies
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests

      - name: Обход карьерных сайтов
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m watcher ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.announce && '--announce' || '' }}

      - name: Сохранить состояние
        if: ${{ !inputs.dry_run && !inputs.announce }}
        run: |
          if [[ -z "$(git status --porcelain data/seen.json)" ]]; then
            echo "Состояние не изменилось"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git commit -m "chore: обновление списка отслеживаемых вакансий"
          git push
